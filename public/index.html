<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth form { display: grid; gap: 10px; }
    .auth label { display: grid; gap: 4px; font-size: 15px; color: #bfd0e5; }
    .auth input { padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font-size: 16px; }
    .auth button { justify-self: start; padding: 10px 18px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth .status { margin: 0 0 12px; font-weight: 700; }
    .auth .error { margin: 10px 0 0; color: #ffb3c0; }
    .auth textarea, li textarea, li input { padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font: inherit; font-size: 16px; }
    li textarea, li input { width: 100%; box-sizing: border-box; margin-bottom: 8px; }
    li .actions { display: flex; gap: 8px; margin-top: 10px; }
    li button { padding: 6px 12px; border: 1px solid #8ad8df; border-radius: 8px; background: transparent; color: #8ad8df; font-size: 14px; cursor: pointer; }
    li button.danger { border-color: #ffb3c0; color: #ffb3c0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계 서버 한곳</div>
    <h1>점령된 자료실</h1>
    <p>메모는 서버 API가 학습용 DB에서 읽어 옵니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">로그인과 메모 읽기·추가·수정·삭제는 모두 이 사이트의 서버 함수만 거칩니다. 서버는 로그인 토큰과 메모 주인을 확인한 요청만 처리합니다.</div>
    <section class="auth" aria-labelledby="auth-title">
      <p class="status" id="auth-title">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form" hidden>
        <label>이메일 <input id="login-email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input id="login-password" type="password" autocomplete="current-password" required></label>
        <button type="submit">로그인</button>
      </form>
      <button id="logout-button" type="button" hidden>로그아웃</button>
      <p class="error" id="auth-error" role="alert" hidden></p>
    </section>
    <section class="auth" id="note-editor" hidden aria-labelledby="note-editor-title">
      <p class="status" id="note-editor-title">새 가상 메모</p>
      <form id="note-form">
        <label>제목 <input id="note-title" maxlength="200" required></label>
        <label>내용 <textarea id="note-body" rows="3" maxlength="5000" required></textarea></label>
        <button type="submit">메모 추가</button>
      </form>
      <p class="error" id="note-error" role="alert" hidden></p>
    </section>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <script type="module">
    // 5단계: 로그인·로그아웃도 서버 함수 /api/session이 맡습니다. 화면 코드에는 Supabase 주소·공개 키·SDK가 없습니다.
    // 서버가 돌려준 로그인 토큰은 이 탭의 sessionStorage에만 두고, 만료되면 다시 로그인합니다.
    const SESSION_KEY = 'vault-session';
    const authTitle = document.querySelector('#auth-title');
    const loginForm = document.querySelector('#login-form');
    const logoutButton = document.querySelector('#logout-button');
    const authError = document.querySelector('#auth-error');
    const list = document.querySelector('#notes');
    const noteEditor = document.querySelector('#note-editor');
    const noteForm = document.querySelector('#note-form');
    const noteError = document.querySelector('#note-error');
    let supabaseSession = null;
    const LOGIN_ERRORS = {
      invalid_credentials: '이메일 또는 비밀번호가 맞지 않습니다.',
      email_not_confirmed: '이메일 인증이 아직 끝나지 않았습니다. 받은 메일의 확인 링크를 먼저 누르세요.',
      over_request_rate_limit: '로그인 시도가 너무 많습니다. 잠시 뒤 다시 시도하세요.',
      user_banned: '사용이 중지된 계정입니다.',
    };
    function showError(message) {
      authError.textContent = message;
      authError.hidden = !message;
    }
    function saveSession(session) {
      try {
        if (session) sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
        else sessionStorage.removeItem(SESSION_KEY);
      } catch {
        // 저장소를 쓸 수 없으면 이 화면에서만 로그인 상태를 유지합니다.
      }
    }
    function storedSession() {
      try {
        const session = JSON.parse(sessionStorage.getItem(SESSION_KEY) ?? 'null');
        if (typeof session?.access_token === 'string' && session.expires_at > Date.now() / 1000) return session;
      } catch {
        // 깨진 값은 로그인하지 않은 것으로 봅니다.
      }
      saveSession(null);
      return null;
    }
    function render(session) {
      authTitle.textContent = session ? `로그인됨: ${session.email ?? ''}` : '로그인하지 않았습니다.';
      loginForm.hidden = Boolean(session);
      logoutButton.hidden = !session;
      supabaseSession = session ?? null;
      loadNotes(supabaseSession);
    }
    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      showError('');
      const button = loginForm.querySelector('button');
      button.disabled = true;
      try {
        const response = await fetch('/api/session', {
          method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: loginForm.querySelector('#login-email').value.trim(),
            password: loginForm.querySelector('#login-password').value,
          }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || typeof data.accessToken !== 'string') {
          showError(`로그인 실패: ${LOGIN_ERRORS[data.error] ?? '로그인할 수 없습니다.'}`);
          return;
        }
        const session = { access_token: data.accessToken, expires_at: data.expiresAt, email: data.email };
        saveSession(session);
        loginForm.reset();
        render(session);
      } catch {
        showError('로그인 실패: 로그인 서버에 연결할 수 없습니다.');
      } finally {
        button.disabled = false;
      }
    });
    logoutButton.addEventListener('click', async () => {
      showError('');
      const token = supabaseSession?.access_token;
      saveSession(null);
      render(null);
      if (!token) return;
      try {
        const response = await fetch('/api/session', { method: 'DELETE', cache: 'no-store',
          headers: { Authorization: `Bearer ${token}` } });
        if (!response.ok && response.status !== 401) showError('로그아웃 실패: 서버에서 세션을 끊지 못했습니다.');
      } catch {
        showError('로그아웃 실패: 로그인 서버에 연결할 수 없습니다.');
      }
    });
    render(storedSession());

    // 3단계: 메모는 로그인한 사람만 다룹니다. 로그인 세션의 access token을 Authorization 헤더로 보내고,
    // 서버가 그 토큰을 직접 검사합니다. 화면은 사용자 번호·역할·owner_id를 따로 보내지 않습니다.
    function showNoteError(message) {
      noteError.textContent = message;
      noteError.hidden = !message;
    }
    async function notesApi(token, path = '', options = {}) {
      const response = await fetch(`/api/notes${path}`, {
        ...options,
        cache: 'no-store',
        headers: { ...options.headers, Authorization: `Bearer ${token}` },
      });
      if (response.status === 401) {
        saveSession(null);
        throw new Error('로그인 확인에 실패했습니다. 다시 로그인하세요.');
      }
      if (response.status === 404) throw new Error('메모를 찾을 수 없습니다.');
      if (response.status === 400) throw new Error('제목과 내용을 모두 적어 주세요.');
      if (!response.ok) throw new Error('서버 API에서 자료를 처리할 수 없습니다.');
      return response.status === 204 ? null : response.json();
    }
    async function loadNotes(session) {
      const token = session?.access_token;
      noteEditor.hidden = !token;
      showNoteError('');
      if (!token) {
        showNotes([], '로그인하면 가상 자료가 보입니다.');
        return;
      }
      try {
        const notes = await notesApi(token);
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (supabaseSession?.access_token !== token) return;
        showNotes(notes, notes.length ? '' : '아직 내 메모가 없습니다.');
      } catch (error) {
        showNotes([], error.message);
      }
    }
    async function changeNote(path, options) {
      showNoteError('');
      const token = supabaseSession?.access_token;
      if (!token) return;
      try {
        await notesApi(token, path, options);
        await loadNotes(supabaseSession);
      } catch (error) {
        showNoteError(error.message);
      }
    }
    const jsonBody = (data) => ({ headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    noteForm.addEventListener('submit', async event => {
      event.preventDefault();
      const title = noteForm.querySelector('#note-title').value;
      const body = noteForm.querySelector('#note-body').value;
      await changeNote('', { method: 'POST', ...jsonBody({ title, body }) });
      if (noteError.hidden) noteForm.reset();
    });
    function noteItem(note) {
      const item = document.createElement('li');
      const title = document.createElement('strong');
      const content = document.createElement('span');
      title.textContent = note.title;
      content.textContent = note.body;
      item.append(title, content);
      if (!note.id) return item;
      const actions = document.createElement('div');
      actions.className = 'actions';
      const edit = document.createElement('button');
      edit.type = 'button';
      edit.textContent = '수정';
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'danger';
      remove.textContent = '삭제';
      actions.append(edit, remove);
      item.append(actions);
      const path = `/${encodeURIComponent(note.id)}`;
      remove.addEventListener('click', () => {
        if (confirm('이 메모를 삭제할까요?')) changeNote(path, { method: 'DELETE' });
      });
      edit.addEventListener('click', () => {
        const titleInput = document.createElement('input');
        const bodyInput = document.createElement('textarea');
        titleInput.value = note.title;
        titleInput.maxLength = 200;
        bodyInput.value = note.body;
        bodyInput.rows = 3;
        bodyInput.maxLength = 5000;
        const save = document.createElement('button');
        save.type = 'button';
        save.textContent = '저장';
        const cancel = document.createElement('button');
        cancel.type = 'button';
        cancel.textContent = '취소';
        const editActions = document.createElement('div');
        editActions.className = 'actions';
        editActions.append(save, cancel);
        item.replaceChildren(titleInput, bodyInput, editActions);
        save.addEventListener('click', () => changeNote(path,
          { method: 'PUT', ...jsonBody({ title: titleInput.value, body: bodyInput.value }) }));
        cancel.addEventListener('click', () => item.replaceWith(noteItem(note)));
      });
      return item;
    }
    function showNotes(notes, message) {
      if (message) {
        const item = document.createElement('li');
        item.textContent = message;
        list.replaceChildren(item);
        return;
      }
      list.replaceChildren(...notes.map(noteItem));
    }
  </script>
</body>
</html>
